
name: Refresh ESPN fantasy data

on:
  workflow_dispatch:
  schedule:
    - cron: '40 14,2 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch ESPN league data
        run: python scripts/fetch_espn.py

      - name: Save updated league data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update ESPN league data"
            git push
          fi
