const key = "fantasy-intelligence-2027-picks";

let picks = [];

try {
 picks = JSON.parse(
  localStorage.getItem(key) || "[]"
 );
 if (!Array.isArray(picks)) picks = [];
} catch {
 picks = [];
}

function save() {
 localStorage.setItem(
  key, JSON.stringify(picks)
 );
 render();
}

function draft(id) {
 id = String(id);

 if (picks.some(p => p.id === id)) return;

 picks.push({
  id:id,
  mine:document.getElementById(
   "team"
  ).value === "mine"
 });

 save();
}

function undo() {
 picks.pop();
 save();
}

function resetDraft() {
 if (confirm("Clear all recorded picks?")) {
  picks = [];
  save();
 }
}

function escapeText(value) {
 return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;");
}

function render() {
 const query = document.getElementById(
  "search"
 ).value.toLowerCase();

 const position = document.getElementById(
  "position"
 ).value;

 const taken = new Set(
  picks.map(p => p.id)
 );

 const available = players.filter(p =>
  !taken.has(String(p.id))
 );

 const mine = picks
  .filter(p => p.mine)
  .map(p => players.find(
   x => String(x.id) === p.id
  ))
  .filter(Boolean);

 document.getElementById(
  "status"
 ).textContent =
  picks.length + " picks recorded | " +
  available.length + " players available";

 document.getElementById(
  "myRoster"
 ).textContent =
  "My roster: " +
  (mine.map(p => p.name).join(", ") || "Empty");

 const filtered = available.filter(p =>
  p.name.toLowerCase().includes(query) &&
  (!position || p.pos === position)
 );

 document.getElementById(
  "rows"
 ).innerHTML = filtered.slice(0,150)
  .map(p => `
   <tr>
    <td>${p.rank ?? "R"}</td>
    <td>${escapeText(p.name)}</td>
    <td>${escapeText(p.pos)}</td>
    <td>${p.score ?? "-"}</td>
    <td>${p.adp ?? "-"}</td>
    <td>${p.median ?? "-"}</td>
    <td>
     <button onclick='draft(${JSON.stringify(
      String(p.id)
     )})'>Drafted</button>
    </td>
   </tr>
  `).join("");
}

document.getElementById(
 "search"
).oninput = render;

document.getElementById(
 "position"
).onchange = render;

render();
</script>
